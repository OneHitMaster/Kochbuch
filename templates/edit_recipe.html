{% extends "base.html" %}

{% block content %}
    <section class="screen active">
        <div class="card" style="padding: 16px;">
            <h2>Rezept bearbeiten</h2>
            <div class="form-grid" style="margin-top: 12px;">
                <div>
                    <input id="newTitle" class="input" placeholder="Rezept-Titel">
                    <input id="newCategory" class="input" placeholder="Kategorie (z.B. Abendessen)">
                    <input id="newImageFile" class="input" type="file" accept="image/*">
                    <input id="newImage" class="input" placeholder="Bild-URL (optional)">
                    <input id="newServings" class="input" type="number" min="1" value="2" placeholder="Portionen">
                    <textarea id="newIngredients" class="input textarea" placeholder="Zutaten (eine pro Zeile, z.B. Zucker|100|g)"></textarea>
                    <textarea id="newSteps" class="input textarea" placeholder="Schritte (eine pro Zeile)"></textarea>
                    <button id="saveRecipeBtn" class="btn btn-primary full-width">Änderungen speichern</button>
                </div>
                <div>
                    <h3 style="margin-top: 0;">Live-Vorschau</h3>
                    <div id="recipePreview" class="preview-card"></div>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Minimal bootstrapping: recipe id comes from the URL.
        window.__COOKMIND_EDIT_RECIPE_ID__ = {{ recipe_id }};
    </script>
{% endblock %}
