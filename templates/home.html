{% extends "base.html" %}

{% block content %}
    <section class="screen active">
        <div class="screen-actions">
            <a class="btn btn-primary" href="/recipes/new">Rezept hinzufügen</a>
        </div>

        <div class="card" style="padding: 14px; margin-bottom: 14px;">
            <h3 style="margin: 0 0 10px;">Nach Mahlzeit</h3>
            <div id="homeMealSlotTabs" class="serving-controls" style="flex-wrap: wrap; margin: 0;"></div>
        </div>

        <div id="homeRecipeList" class="card-grid"></div>

        <div id="homeEmptyState" class="empty-state hidden">
            <p>Noch keine Rezepte vorhanden. Füge dein erstes hinzu!</p>
        </div>
    </section>
{% endblock %}
