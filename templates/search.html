{% extends "base.html" %}

{% block content %}
    <section class="screen active">
        <div class="card" style="padding: 16px;">
            <h2>Search Recipes</h2>
            <input id="searchName" class="input" placeholder="Search by name">
            <input id="searchIngredient" class="input" placeholder="Search by ingredients (comma separated)">
            <input id="searchCategory" class="input" placeholder="Search by category">
            <button id="searchBtn" class="btn btn-primary full-width">Search</button>
        </div>

        <div class="card" style="padding: 16px; margin-top: 14px;">
            <h2>AI Suggestion</h2>
            <p class="muted">What ingredients do you have? (comma separated)</p>
            <input id="aiIngredientInput" class="input" placeholder="e.g. pasta, garlic, tomato">
            <button id="suggestBtn" class="btn btn-secondary full-width">Suggest Recipes</button>
        </div>

        <div id="searchResults" class="card-grid" style="margin-top: 14px;"></div>
    </section>
{% endblock %}
