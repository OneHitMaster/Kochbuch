{% extends "base.html" %}

{% block content %}
    <section class="screen active">
        <div class="card" style="padding: 16px;">
            <h2>Rezepte suchen</h2>
            <input id="searchName" class="input" placeholder="Suche nach Name">
            <input id="searchIngredient" class="input" placeholder="Suche nach Zutaten (kommagetrennt)">
            <input id="searchCategory" class="input" placeholder="Suche nach Kategorie">
            <button id="searchBtn" class="btn btn-primary full-width">Suchen</button>
        </div>

        <div class="card" style="padding: 16px; margin-top: 14px;">
            <h2>AI-Vorschläge</h2>
            <p class="muted">Welche Zutaten hast du? (kommagetrennt)</p>
            <input id="aiIngredientInput" class="input" placeholder="z.B. pasta, knoblauch, tomaten">
            <button id="suggestBtn" class="btn btn-secondary full-width">Vorschläge anzeigen</button>
        </div>

        <div id="searchResults" class="card-grid" style="margin-top: 14px;"></div>
    </section>
{% endblock %}
